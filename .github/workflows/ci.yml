name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Biçim kontrolü
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Birim testler
        run: npm run test:ci

      - name: Üretim derlemesi
        run: npm run build

      - name: Derleme çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
