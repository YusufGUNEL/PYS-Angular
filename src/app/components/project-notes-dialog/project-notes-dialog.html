<p-toast />

<div class="flex flex-col gap-4 min-h-[220px]">
  @if (loading) {
    <div class="text-center text-slate-500 py-8">
      <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
      <p class="mt-2">Notlar yükleniyor...</p>
    </div>
  }

  @if (!loading) {
    <div class="space-y-4">
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <label for="newNote" class="text-sm text-slate-600">Yeni Not</label>
          <span class="text-xs text-slate-400">{{ newNote.length }} / 1000</span>
        </div>
        <textarea
          id="newNote"
          pInputTextarea
          rows="3"
          maxlength="1000"
          [(ngModel)]="newNote"
          class="w-full"
        ></textarea>
        <div class="flex justify-end">
          <button
            pButton
            type="button"
            label="Not Ekle"
            [loading]="saving"
            [disabled]="newNote.trim().length === 0 || saving"
            (click)="addNote()"
          ></button>
        </div>
      </div>
      <div class="border-t border-slate-100 pt-3">
        @if (notes.length === 0) {
          <div class="text-slate-400 italic">Henüz not yok.</div>
        }
        @for (note of notes; track note.id) {
          <div class="flex items-start justify-between gap-3 py-2 border-b border-slate-100">
            <div class="text-sm text-slate-700 whitespace-pre-wrap">{{ note.content }}</div>
            <button
              pButton
              type="button"
              icon="fa-solid fa-trash"
              aria-label="Notu sil"
              class="p-button-text p-button-danger"
              (click)="deleteNote(note)"
            ></button>
          </div>
        }
      </div>
    </div>
  }

  <div class="flex justify-end pt-2 border-t border-slate-100">
    <button
      pButton
      type="button"
      icon="fa-solid fa-xmark"
      label="Kapat"
      class="p-button-text"
      (click)="close()"
    ></button>
  </div>
</div>
